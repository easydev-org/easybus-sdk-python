name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The SDK declares no floor, so CI is where a floor actually gets
        # discovered: the oldest version here is the oldest one that works.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"

      # test_proto_sync asserts the COMMITTED generated bindings still match the
      # .proto. Python is the only language here that checks in its generated
      # code, so it is the only one that can silently drift — this test is what
      # caught it last time.
      - name: unit + proto-sync
        run: python -m pytest tests/ -q -m "not integration"

  # Runs in the SAME image the other three SDKs use, against the SAME pinned broker.
  #
  # The matrix above covers interpreter versions on the host; this job covers the
  # ENVIRONMENT. A hard-coded nats download here would make the broker an untracked
  # variable — two SDKs could pass against different versions and nothing would
  # notice. docker-compose.yml pins one image for all four.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--exit-code-from` makes the container's exit code the step's exit code, so a
      # failing assertion fails the job without extra plumbing.
      - name: conformance in a pinned environment
        run: |
          docker compose up --build --abort-on-container-exit \
            --exit-code-from conformance

      - name: logs
        if: failure()
        run: docker compose logs --no-color

      - name: down
        if: always()
        run: docker compose down -v
