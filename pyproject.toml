[project]
name = "easybus-sdk"
version = "0.1.0"
description = "easybus protocol SDK (Python) — the multi-tenant extension bus. Wire contract: proto/easybus/v1/protocol.proto (the single source of truth, shared with easybus-sdk Go/TypeScript/Rust)."
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.9.0",
    "protobuf>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
