[pytest]
testpaths = tests
asyncio_mode = auto
# `integration` marks a test that needs a REAL broker. The unit job excludes it
# (`-m "not integration"`); the broker job and the compose image run it. Renaming the
# `nats_server` fixture's skip into a failure for these is the point: a missing broker
# in the broker job must fail, not quietly reduce coverage to nothing.
markers =
    integration: requires a real nats-server
